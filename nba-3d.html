<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NBA 3D ARENA | THEANKLEBREAKER</title><style>
*{box-sizing:border-box}body{margin:0;background:#06080f;color:white;font:15px Arial,sans-serif;overflow:hidden}#scene{position:fixed;inset:0}header{position:fixed;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;gap:18px;padding:18px 24px;background:linear-gradient(#070a12ed,transparent)}a{color:white;text-decoration:none}.logo{font-weight:900;font-size:20px;letter-spacing:1px}.logo b{color:#ff7625}.tag{font-size:11px;letter-spacing:2px;color:#a9b6ca}#help{position:fixed;bottom:22px;left:22px;z-index:3;padding:14px 18px;background:#0b1022dc;border:1px solid #394055;border-radius:12px;max-width:340px;line-height:1.6}#panel{position:fixed;right:20px;top:90px;z-index:4;width:min(360px,calc(100vw - 40px));max-height:75vh;overflow:auto;background:#0b1022ef;border:1px solid #ff762588;border-radius:16px;padding:20px;box-shadow:0 15px 70px #000a;display:none}#panel h2{font-size:20px}#panel a{color:#ff9c58;text-decoration:underline}#panel button,.control{border:1px solid #ff7625;background:#ff7625;color:#101018;border-radius:9px;padding:9px 14px;font-weight:bold;cursor:pointer}#panel button{float:right}#loading{position:fixed;top:90px;left:24px;z-index:3;color:#e2e5f2}#mobile{position:fixed;bottom:20px;right:20px;z-index:3;display:flex;gap:8px;flex-wrap:wrap;max-width:200px;justify-content:end}#mobile button{background:#11192be8;color:white;border:1px solid #ff7625;border-radius:8px;padding:13px;cursor:pointer}small{color:#9da7bb} @media(max-width:700px){#help{bottom:100px;max-width:240px;font-size:12px}header{padding:12px}.tag{display:none}#panel{top:65px}}
</style></head><body><div id="scene"></div><header><a class="logo" href="/">THE<b>ANKLEBREAKER</b></a><span class="tag">NBA NEWS • VIRTUAL ARENA</span><a style="margin-left:auto;border:1px solid #ff7625;padding:9px 13px;border-radius:8px" href="/">← SITE</a></header><div id="loading">Chargement de l'arène 3D…</div><div id="help">🏀 <b>Explore l'arène NBA</b><br>Glisse pour regarder autour • molette pour avancer/reculer • clique sur les panneaux pour lire les actualités.<br><small>Clavier : ZQSD / WASD ou flèches. Échap : fermer l'article.</small></div><div id="panel"><button id="close">✕</button><div id="detail"></div></div><div id="mobile"><button data-move="forward">↑</button><button data-move="left">←</button><button data-move="back">↓</button><button data-move="right">→</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const host=document.querySelector('#scene'), scene=new THREE.Scene();scene.background=new THREE.Color('#050711');scene.fog=new THREE.FogExp2(0x050711,.016);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,350);camera.position.set(0,3.5,24);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x7896ff,0x151320,2));const light=new THREE.PointLight(0xff7625,90,75);light.position.set(0,16,0);scene.add(light);
const mat=(color,roughness=.8)=>new THREE.MeshStandardMaterial({color,roughness,metalness:.2});const floor=new THREE.Mesh(new THREE.PlaneGeometry(180,180),mat(0x101522));floor.rotation.x=-Math.PI/2;floor.position.y=-.1;scene.add(floor);
const court=new THREE.Mesh(new THREE.PlaneGeometry(27,15),mat(0x874a28));court.rotation.x=-Math.PI/2;court.position.y=0;scene.add(court);
function line(points,color=0xffffff){const geometry=new THREE.BufferGeometry().setFromPoints(points.map(([x,z])=>new THREE.Vector3(x,.035,z)));scene.add(new THREE.Line(geometry,new THREE.LineBasicMaterial({color})))}
line([[-13,-7],[-13,7],[13,7],[13,-7],[-13,-7]]);line([[0,-7],[0,7]]);const circle=[];for(let i=0;i<=64;i++){let a=i*Math.PI*2/64;circle.push([Math.cos(a)*2,Math.sin(a)*2])}line(circle);
for(let i=0;i<3;i++){const ring=new THREE.Mesh(new THREE.TorusGeometry(18+i*4,.22,8,110),new THREE.MeshBasicMaterial({color:i===0?0xff7625:0x263456}));ring.rotation.x=Math.PI/2;ring.position.y=.15+i*.7;scene.add(ring)}
for(let i=0;i<40;i++){const angle=i*Math.PI/20;const r=25+Math.floor(i/20)*4;const pillar=new THREE.Mesh(new THREE.BoxGeometry(1.4,4,1.4),mat(i%3===0?0xff7625:0x26344d));pillar.position.set(Math.cos(angle)*r,2,Math.sin(angle)*r);scene.add(pillar)}
const panels=[];const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();function texture(title,subtitle,index){const c=document.createElement('canvas');c.width=1024;c.height=512;const g=c.getContext('2d');g.fillStyle='#0d1529';g.fillRect(0,0,1024,512);g.fillStyle='#ff7625';g.fillRect(0,0,1024,18);g.font='bold 29px Arial';g.fillStyle='#ffae78';g.fillText('NBA NEWS  /  '+String(index+1).padStart(2,'0'),50,75);g.fillStyle='#fff';g.font='bold 46px Arial';const words=title.split(' ');let rows=[''];for(const w of words){let n=rows.length-1;if(g.measureText(rows[n]+' '+w).width>900&&rows.length<4)rows.push(w);else rows[n]+=(rows[n]?' ':'')+w}rows.slice(0,4).forEach((r,i)=>g.fillText(r,50,150+i*60));g.fillStyle='#9eabc4';g.font='25px Arial';g.fillText(subtitle.slice(0,65),50,445);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
let news=[];function addPanel(item,i){const a=i*2*Math.PI/10;const r=32;const mesh=new THREE.Mesh(new THREE.PlaneGeometry(11,5.5),new THREE.MeshBasicMaterial({map:texture(item.headline||item.title||'NBA',item.description||'Clique pour découvrir',i),side:THREE.DoubleSide}));mesh.position.set(Math.sin(a)*r,6,-Math.cos(a)*r);mesh.lookAt(0,6,0);mesh.userData.item=item;scene.add(mesh);panels.push(mesh);const base=new THREE.Mesh(new THREE.BoxGeometry(11.4,5.9,.2),mat(0xff7625));base.position.copy(mesh.position);base.quaternion.copy(mesh.quaternion);base.translateZ(-.13);scene.add(base)}
async function load(){try{const r=await fetch('/api/nba/news');if(!r.ok)throw Error('API');const d=await r.json();news=(d.articles||[]).slice(0,10);if(!news.length)throw Error('Vide');news.forEach(addPanel);document.querySelector('#loading').textContent='Clique sur les écrans lumineux pour découvrir les actualités NBA.'}catch(e){document.querySelector('#loading').textContent='Actualités indisponibles actuellement. L’arène 3D reste accessible.'}}load();
const panel=document.querySelector('#panel');document.querySelector('#close').onclick=()=>panel.style.display='none';function select(e){if(e.target.closest('button,a'))return;mouse.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(panels);if(!hits.length)return;const a=hits[0].object.userData.item;const d=document.querySelector('#detail');d.replaceChildren();const h=document.createElement('h2');h.textContent=a.headline||a.title||'Actualité NBA';d.append(h);const p=document.createElement('p');p.textContent=a.description||a.story||'Consulte la source pour lire cet article.';d.append(p);const u=a.links?.web?.href||a.links?.api?.news?.href||a.link;if(u&&/^https:\/\//.test(u)){const link=document.createElement('a');link.href=u;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Lire l’article complet ↗';d.append(link)}panel.style.display='block'}
let dragging=false,lastX=0,lastY=0,travel=0,yaw=0,pitch=-.05;renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;travel=0;lastX=e.clientX;lastY=e.clientY});window.addEventListener('pointerup',e=>{if(dragging&&travel<6)select(e);dragging=false});window.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;travel+=Math.abs(dx)+Math.abs(dy);yaw-=dx*.004;pitch=Math.max(-1.1,Math.min(.9,pitch-dy*.004));lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();camera.position.x-=Math.sin(yaw)*Math.sign(e.deltaY)*1.5;camera.position.z-=Math.cos(yaw)*Math.sign(e.deltaY)*1.5},{passive:false});
const keys=new Set();window.addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.key==='Escape')panel.style.display='none'});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));document.querySelectorAll('[data-move]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.stopPropagation();keys.add(({forward:'w',back:'s',left:'a',right:'d'})[b.dataset.move])});for(const t of ['pointerup','pointerleave','pointercancel'])b.addEventListener(t,()=>keys.clear())});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05),speed=11*dt;camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;let f=Number(keys.has('w')||keys.has('z')||keys.has('arrowup'))-Number(keys.has('s')||keys.has('arrowdown'));let side=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('q')||keys.has('arrowleft'));camera.position.x+=(-Math.sin(yaw)*f+Math.cos(yaw)*side)*speed;camera.position.z+=(-Math.cos(yaw)*f-Math.sin(yaw)*side)*speed;camera.position.x=THREE.MathUtils.clamp(camera.position.x,-44,44);camera.position.z=THREE.MathUtils.clamp(camera.position.z,-44,44);renderer.render(scene,camera)}animate();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
